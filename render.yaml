# NOTE: The in-process reminder scheduler only fires while the web instance
# is awake. On the free tier the instance sleeps after ~15 min of inactivity,
# so scheduled reminders may be delayed. For guaranteed delivery, either
# upgrade the plan or have an external cron POST/GET /api/reminders/run (admin
# auth required) on the desired schedule.
services:
  - type: web
    name: nhatky-thi-cong
    env: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nhatky-db
          property: connectionString
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: nhatky-db
    plan: free
