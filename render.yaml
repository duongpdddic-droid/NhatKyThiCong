services:
  - type: web
    name: nhatky-thi-cong
    env: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nhatky-db
          property: connectionString

databases:
  - name: nhatky-db
    plan: free
