{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<h2>Đổi mật khẩu</h2>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/change-password">
  <div class="form-group"><label>Mật khẩu cũ</label><input type="password" name="old_password" required></div>
  <div class="form-group"><label>Mật khẩu mới</label><input type="password" name="new_password" required minlength="6"></div>
  <div class="form-group"><label>Xác nhận mật khẩu mới</label><input type="password" name="confirm" required></div>
  <button type="submit" class="btn primary full">Đổi mật khẩu</button>
</form>
<a href="/" class="btn sm" style="margin-top:12px;">← Quay lại</a>
{% endblock %}
