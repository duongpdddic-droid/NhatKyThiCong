{% extends "base.html" %}
{% block title %}Cài đặt{% endblock %}
{% block content %}
<h2>Cài đặt hệ thống</h2>
<a href="/admin/users" class="btn sm">👥 User</a>
<a href="/admin/library" class="btn sm">📚 Thư viện</a>

<form method="post" action="/admin/settings" class="section" style="margin-top:12px;">
  <h2>Thời tiết (OpenWeatherMap)</h2>
  <div class="form-group">
    <label>API Key</label>
    <input type="text" name="openweather_api_key" value="{{ settings.get('openweather_api_key', '') }}" placeholder="Nhập API key từ openweathermap.org">
  </div>
  <p style="font-size:12px;color:var(--muted);">Đăng ký miễn phí tại <a href="https://openweathermap.org/api" target="_blank">openweathermap.org/api</a></p>

  <h2 style="margin-top:16px;">Telegram Bot</h2>
  <div class="form-group">
    <label>Bot Token</label>
    <input type="text" name="telegram_bot_token" value="{{ settings.get('telegram_bot_token', '') }}" placeholder="Token từ @BotFather">
  </div>
  <p style="font-size:12px;color:var(--muted);">Tạo bot: chat @BotFather → /newbot → copy token</p>

  <button type="submit" class="btn primary full" style="margin-top:12px;">💾 Lưu cài đặt</button>
</form>
{% endblock %}
