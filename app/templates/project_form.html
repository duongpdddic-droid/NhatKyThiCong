{% extends "base.html" %}
{% block title %}{% if project %}Sửa dự án{% else %}Dự án mới{% endif %}{% endblock %}
{% block content %}
<h2>{% if project %}Sửa dự án{% else %}Dự án mới{% endif %}</h2>
{% if project %}
<form method="post" action="/projects/{{ project.id }}/edit">
{% else %}
<form method="post" action="/projects/new">
{% endif %}
  <div class="form-group"><label>Tên dự án</label><input type="text" name="name" value="{{ project.name if project else '' }}" required></div>
  <div class="form-group"><label>Địa chỉ</label><input type="text" name="address" value="{{ project.address if project else '' }}"></div>
  <div class="form-group"><label>Chủ đầu tư</label><input type="text" name="investor" value="{{ project.investor if project else '' }}"></div>
  <div class="form-group"><label>Nhà thầu</label><input type="text" name="contractor" value="{{ project.contractor if project else '' }}"></div>
  <div class="form-group"><label>TVGS</label><input type="text" name="supervisor" value="{{ project.supervisor if project else '' }}"></div>
  <div class="form-row">
    <div class="form-group"><label>Ngày bắt đầu</label><input type="date" name="start_date" value="{{ project.start_date if project else '' }}"></div>
    <div class="form-group"><label>Ngày kết thúc</label><input type="date" name="end_date" value="{{ project.end_date if project else '' }}"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Vĩ độ</label><input type="number" step="any" name="lat" value="{{ project.lat if project and project.lat is not none else 21.0 }}" required></div>
    <div class="form-group"><label>Kinh độ</label><input type="number" step="any" name="lon" value="{{ project.lon if project and project.lon is not none else 105.8 }}" required></div>
  </div>
  <button type="submit" class="btn primary full">{% if project %}Cập nhật{% else %}Tạo dự án{% endif %}</button>
</form>
<a href="{% if project %}/projects/{{ project.id }}{% else %}/{% endif %}" class="btn sm" style="margin-top:12px;">← Quay lại</a>
{% endblock %}
